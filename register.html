<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artist Registration - Mayra Distribution</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#160d2d;
  color:white;
}
.container{
  max-width:520px;
  margin:40px auto;
  padding:25px;
}
.card{
  background:#241343;
  border:1px solid #7d42d9;
  border-radius:25px;
  padding:30px 25px;
}
h1{
  text-align:center;
  margin-bottom:10px;
}
.subtitle{
  text-align:center;
  color:#bbb0d0;
  margin-bottom:25px;
}
label{
  display:block;
  margin:15px 0 7px;
}
input{
  width:100%;
  padding:14px;
  border-radius:10px;
  border:1px solid #62409b;
  background:#120b23;
  color:white;
  font-size:16px;
}
button{
  width:100%;
  margin-top:25px;
  padding:15px;
  border:0;
  border-radius:12px;
  background:linear-gradient(90deg,#9b4dff,#ed3d91);
  color:white;
  font-size:18px;
  font-weight:bold;
}
.back{
  display:block;
  text-align:center;
  margin-top:20px;
  color:#c5a8ff;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="container">
  <div class="card">

    <h1>Artist Registration</h1>

    <p class="subtitle">
      Create your Mayra Distribution artist account
    </p>

    <form>

      <label>Artist / Label Name</label>
      <input type="text" placeholder="Enter artist or label name">

      <label>Full Name</label>
      <input type="text" placeholder="Enter your full name">

      <label>Email Address</label>
      <input type="email" placeholder="Enter your email">

      <label>Mobile Number</label>
      <input type="tel" placeholder="Enter mobile number">

      <label>Password</label>
      <input type="password" placeholder="Create password">

      <label>Confirm Password</label>
      <input type="password" placeholder="Confirm password">

      <button type="submit">Create Artist Account</button>

    </form>

    <a class="back" href="index.html">← Back to Mayra Distribution</a>

  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script>// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBgt9SIgIja_GmG6z7miPvPlb0B5yyaPYY",
  authDomain: "mayra-distribution-6a057.firebaseapp.com",
  projectId: "mayra-distribution-6a057",
  storageBucket: "mayra-distribution-6a057.firebasestorage.app",
  messagingSenderId: "847128560570",
  appId: "1:847128560570:web:306a7d31596d4d04ee1383",
  measurementId: "G-21FMVR7X7L"
};firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

const form = document.querySelector("form");
const inputs = form.querySelectorAll("input");

form.addEventListener("submit", function(e) {
  e.preventDefault();

  const email = inputs[2].value;
  const password = inputs[4].value;
  const confirmPassword = inputs[5].value;

  if (password !== confirmPassword) {
    alert("Password match nahi kar raha!");
    return;
  }

  auth.createUserWithEmailAndPassword(email, password)
    .then(() => {
      alert("Artist account successfully create ho gaya!");
      form.reset();
    })
    .catch((error) => {
      alert(error.message);
    });
});
</script>
</body>
</html>
